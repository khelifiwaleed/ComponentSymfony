<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Widget dans Modal avec iframe + injection HTML</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    #widget-loader {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1055;
      background: rgba(255,255,255,0.8);
      padding: 30px;
      border-radius: 10px;
      text-align: center;
      display: none;
    }
    .iframe-container {
      position: relative;
      height: 600px;
      width: 100%;
      overflow: hidden;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

<div class="container mt-5">
  <button id="open-widget" class="btn btn-primary">Ouvrir le widget</button>
</div>

<div class="modal fade" id="widgetModal" tabindex="-1" aria-labelledby="widgetModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-xl">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="widgetModalLabel">Widget</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button>
      </div>
      <div class="modal-body p-0">
        <div class="iframe-container">
          <div id="widget-loader">
            <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
              <span class="visually-hidden">Chargement...</span>
            </div>
            <p class="mt-3 mb-0">Chargement du widget...</p>
          </div>
          <iframe id="widget-iframe" src="about:blank" title="Widget"></iframe>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const openBtn = document.getElementById('open-widget');
    const modal = new bootstrap.Modal(document.getElementById('widgetModal'));
    const iframe = document.getElementById('widget-iframe');
    const loader = document.getElementById('widget-loader');

    openBtn.addEventListener('click', async () => {
      loader.style.display = 'block';
      modal.show();

      try {
        const postData = {
          name: 'Waleed',
          email: 'khelifiwaleed@gmail.com'
        };

        const response = await fetch('http://khelifiwaleed.local', {
          method: 'POST',
          /* headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer VOTRE_TOKEN_ICI'
          }, */
          body: JSON.stringify(postData)
        });

        if (!response.ok) throw new Error('Erreur HTTP : ' + response.status);

        const html = await response.text();

        const doc = iframe.contentDocument || iframe.contentWindow.document;
        doc.open();
        doc.write(html);
        doc.close();

        iframe.onload = () => {
          loader.style.display = 'none';
        };

      } catch (error) {
        loader.style.display = 'none';
        const doc = iframe.contentDocument || iframe.contentWindow.document;
        doc.open();
        doc.write(`
          <div style="display:flex;justify-content:center;align-items:center;height:100%;padding:20px;text-align:center;">
            <div>
              <h2 style="color:#dc3545;">Erreur de chargement</h2>
              <button onclick="window.parent.document.getElementById('widgetModal').querySelector('.btn-close').click()"
                      style="margin-top:20px; padding:10px 20px; background:#0d6efd; color:white; border:none; border-radius:5px; cursor:pointer;">
                Fermer
              </button>
            </div>
          </div>
       `);
        doc.close();
      }

    });
  });

</script>

</body>
</html>
