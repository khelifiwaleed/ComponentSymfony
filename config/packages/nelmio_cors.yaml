nelmio_cors:
    defaults:
        allow_credentials: false
        allow_origin: ['*'] # OU remplace par ['http://localhost:5500'] par exemple
        allow_headers: ['Content-Type', 'Authorization']
        allow_methods: ['GET', 'OPTIONS', 'POST']
        max_age: 3600
    paths:
        '^/': # Appliquer CORS sur toutes les routes
            allow_origin: ['*']
            allow_headers: ['Content-Type', 'Authorization']
            allow_methods: ['GET', 'OPTIONS', 'POST']
